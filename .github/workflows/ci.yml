name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install fastapi uvicorn httpx pyyaml "opentelemetry-sdk" "opentelemetry-exporter-otlp" psutil ruff
      - name: Syntax check
        run: python -m py_compile gateway.py
      - name: Lint (non-blocking)
        run: ruff check . || true
