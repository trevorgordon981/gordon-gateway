name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test dependencies
        run: python -m pip install --upgrade pip && pip install fastapi httpx uvicorn
      - name: Syntax check
        run: python -m compileall -q gateway.py tests test_gateway_sessions.py
      - name: Run offline and route tests
        run: python -m unittest discover -s tests -v
      - name: Run session isolation tests
        run: python -m unittest test_gateway_sessions.py -v
