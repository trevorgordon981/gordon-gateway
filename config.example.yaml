# gordon-gateway config.example.yaml
# -----------------------------------------------------------------------------
# Copy to ~/gordon-gateway/config.yaml and edit, OR omit the file entirely and
# set the equivalent environment variables (every key below has an env override;
# env always WINS over YAML). If PyYAML is not installed the file is ignored and
# pure-env config is used.
#
# SECRETS CONTRACT:
# Secrets (MASTER_KEY, OPENROUTER_API_KEY) must ONLY come from explicit process
# environment variables OR the owner-only (chmod 0600) secret file referenced by
# GATEWAY_SECRET_ENV (default ~/.config/gordon-gateway/secrets.env).
# NEVER store secrets in this YAML file, launchd plists, systemd units, or Git.
#
# Two modes. Pick ONE per process:
#   mode: alfred   -> routing + model selection + Anthropic xlate + OTLP
#   mode: walter   -> blockops tool-call xlate + loop guards + OTLP
# -----------------------------------------------------------------------------

# ======== COMMON (both modes) ========
mode: alfred                       # env GATEWAY_MODE   ("alfred" | "walter")
host: 127.0.0.1                    # env HOST
# port:                            # env PORT   (default 8091 alfred / 8080 walter)

# ---- tracing / metrics (applies in BOTH modes) ----
tracing_enabled: true              # env TRACING_ENABLED
otel_endpoint: "http://127.0.0.1:4317"   # env OTEL_ENDPOINT (loopback allows http; remote REQUIRES https:// + auth)
# otel_headers: "authorization=Bearer <token>"  # env OTEL_EXPORTER_OTLP_HEADERS (REQUIRED for non-loopback endpoints)
trace_content: false               # env TRACE_CONTENT  (default false = metadata-only; never exports prompt text unless opted in)
service_name: "llm-gateway"        # env OTEL_SERVICE_NAME
primary_user_id: "primary-user"    # env PRIMARY_USER_ID  (deployment-local user id -> user_class=primary)
sonnet_input_price: 15.0           # env SONNET_INPUT_PRICE   ($/1M input tok, reference cost)
sonnet_output_price: 75.0          # env SONNET_OUTPUT_PRICE  ($/1M output tok, reference cost)
# metrics_state_file:              # env METRICS_STATE_FILE  (default ~/gordon-gateway/metrics_state.json)
# metrics_state_save_interval: 30  # env METRICS_STATE_SAVE_INTERVAL

# log_file:                        # env LOG_FILE   (default ~/.gordon-gateway/logs/gateway.log; rotating)

# ======== ALFRED MODE ONLY ========
# Provide MASTER_KEY via env or GATEWAY_SECRET_ENV (chmod 0600) — NEVER here or in a launchd plist.
# max_body_bytes: 52428800         # env MAX_BODY_BYTES
# default_max_tokens: 16384        # env DEFAULT_MAX_TOKENS

# ---- Retry & data-boundary fallback policy ----
# Transport errors, timeouts, malformed 200 payloads, and HTTP 5xx advance the
# fallback chain. HTTP 4xx statuses are TERMINAL by default unless listed here.
retryable_4xx_statuses: []         # env RETRYABLE_4XX_STATUSES (e.g. "408,429")

# Crossing from a local backend to an external/cloud fallback backend is BLOCKED
# by default. Enable globally or per-route only when external prompt egress is
# intentionally authorized.
allow_external_fallback: false     # env ALLOW_EXTERNAL_FALLBACK
external_fallback_routes: []       # env EXTERNAL_FALLBACK_ROUTES (e.g. "qwen-397b")

# Backend routing table. If omitted, generic loopback defaults are used.
# api_key may be a literal (non-secret placeholder) or "env:VARNAME".
# trust_boundary defaults to "local" for loopback hosts and "external" otherwise.
# backends:
#   - name: qwen-397b
#     base_url: "http://127.0.0.1:8090/v1"
#     upstream_model: "/path/to/models/qwen3.5-397b-6bit"
#     api_key: "not-needed"
#     trust_boundary: "local"
#   - name: kimi-k2.6
#     base_url: "http://127.0.0.1:8082/v1"
#     upstream_model: "kimi-k2.6"
#     api_key: "not-needed"
#     trust_boundary: "local"
#   - name: glm-5.1
#     base_url: "http://127.0.0.1:8082/v1"
#     upstream_model: "glm-5.1"
#     api_key: "not-needed"
#     trust_boundary: "local"
#   - name: qwen-alfred-router
#     base_url: "http://127.0.0.1:9003/v1"   # env ROUTER_BASE_URL
#     upstream_model: "qwen-alfred-router"
#     api_key: "not-needed"
#     trust_boundary: "local"
#   - name: openrouter-free
#     base_url: "https://openrouter.ai/api/v1"
#     upstream_model: "nvidia/nemotron-3-super-120b-a12b:free"
#     api_key: "env:OPENROUTER_API_KEY"
#     trust_boundary: "external"
#     extra_headers:
#       HTTP-Referer: "http://localhost"     # env OPENROUTER_REFERER
#       X-Title: "gordon-gateway"

# Fallback chains: requested model -> ordered list of fallback backend names.
# Local->local fallbacks work automatically on transport/5xx errors.
# Local->external fallbacks additionally require allow_external_fallback or
# external_fallback_routes authorization.
# fallbacks:
#   qwen-397b: ["glm-5.1"]

# ======== WALTER MODE ONLY ========
walter_backend: "http://127.0.0.1:8082"    # env BACKEND_URL  (the local LLM server)
backend_strip_path_prefix: ""              # env BACKEND_STRIP_PATH_PREFIX  (e.g. "/v1")
model_name: ""                             # env MODEL_NAME    (session-banner display name)

# Canonical model id/path. An unknown/missing `model` field is coerced to this
# by normalize_upstream_model() so a local serving engine does NOT cache-clear
# or cold-reload on an unrecognized alias.
walter_canonical_model: "qwen3.5-122b-a10b-8bit"   # env WALTER_CANONICAL_MODEL

# Per-role backend URLs. Default to walter_backend so single-server hosts keep
# single-backend behaviour; point elsewhere on multi-server hosts.
coder_backend: "http://127.0.0.1:8082"     # env CODER_BACKEND   (coder / qwen-coder aliases)
reason_backend: "http://127.0.0.1:8082"    # env REASON_BACKEND  (reason / qwen-reason / r1 aliases)

# Alias -> upstream model-id map, and per-model backend overrides.
# Provide an explicit empty map ({}) to force pure pass-through with no aliasing.
# model_aliases:
#   qwen35:       "/path/to/models/qwen3.5-122b-a10b-8bit"
#   coder:        "/path/to/models/qwen3.5-122b-a10b-8bit"
#   reason:       "/path/to/models/qwen3.5-122b-a10b-8bit"
#   r1:           "/path/to/models/qwen3.5-122b-a10b-8bit"
# model_backends:
#   coder:  "http://127.0.0.1:8083"
#   reason: "http://127.0.0.1:8084"
#   r1:     "http://127.0.0.1:8084"

# ---- blockops tuning (all have env overrides of the same UPPER_SNAKE name) ----
heartbeat_interval: 5                      # HEARTBEAT_INTERVAL
max_messages: 300                          # MAX_MESSAGES
max_concurrent: 3                          # MAX_CONCURRENT  (per-backend in-flight cap)
loop_nudge_threshold: 4                    # LOOP_NUDGE_THRESHOLD
loop_stop_threshold: 8                     # LOOP_STOP_THRESHOLD
loop_cycle_nudge_reps: 3                   # LOOP_CYCLE_NUDGE_REPS
loop_cycle_stop_reps: 4                    # LOOP_CYCLE_STOP_REPS
loop_cycle_max_len: 4                      # LOOP_CYCLE_MAX_LEN
loop_session_nudge_limit: 8                # LOOP_SESSION_NUDGE_LIMIT
repeat_parse_error_stop: 2                 # REPEAT_PARSE_ERROR_STOP
# Conversation state is isolated by X-Claude-Code-Session-Id (plus agent ID),
# X-Gordon-Session-Id, metadata.session_id, or a deterministic root fallback.
# The in-memory LRU is bounded and idle entries expire; raw IDs are never stored.
session_state_max: 512                     # SESSION_STATE_MAX
session_state_ttl_seconds: 43200           # SESSION_STATE_TTL_SECONDS (12 hours)
session_parse_error_keys_max: 32           # SESSION_PARSE_ERROR_KEYS_MAX (per session)
tool_result_compression_threshold: 15000   # TOOL_RESULT_COMPRESSION_THRESHOLD
token_warn_threshold: 80000                # TOKEN_WARN_THRESHOLD
token_hard_threshold: 100000               # TOKEN_HARD_THRESHOLD
cache_purge_mb_threshold: 12000            # CACHE_PURGE_MB_THRESHOLD
cache_idle_seconds: 60                     # CACHE_IDLE_SECONDS
# blockops_log_file:                       # BLOCKOPS_LOG_FILE  (default ~/.gordon-gateway/blockops.log)
