[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gordon-gateway"
version = "1.1.0"
description = "Unified config-driven OpenAI/Anthropic LLM gateway proxy with failover, SSE integrity, prompt-injected tool adaptation, and OTLP telemetry."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "httpx>=0.27.0,<0.29.0",
    "uvicorn>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
yaml = [
    "PyYAML>=6.0.1,<7.0.0",
]
memory = [
    "psutil>=5.9.8,<8.0.0",
]
otel = [
    "opentelemetry-api>=1.25.0,<2.0.0",
    "opentelemetry-sdk>=1.25.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0,<2.0.0",
]
all = [
    "PyYAML>=6.0.1,<7.0.0",
    "psutil>=5.9.8,<8.0.0",
    "opentelemetry-api>=1.25.0,<2.0.0",
    "opentelemetry-sdk>=1.25.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0,<2.0.0",
]

[tool.setuptools]
py-modules = ["gateway"]
